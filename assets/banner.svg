<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="200" viewBox="0 0 800 200"><defs><linearGradient id="grad1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" style="stop-color:#2a2a72;stop-opacity:1"/><stop offset="100%" style="stop-color:#009ffd;stop-opacity:1"/></linearGradient><style>@keyframes glow{0%{filter:drop-shadow(0 0 5px #009ffd)}}@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-15px)}}.subtitle,.title{font-family:&apos;Inter&apos;,&apos;Segoe UI&apos;,Tahoma,Geneva,Verdana,sans-serif}.title{font-size:42px;font-weight:800;fill:#fff}.subtitle{font-size:18px;font-weight:400;fill:#e0e0e0}.anim-glow{animation:glow 3s ease-in-out infinite alternate}.math-symbol{font-family:&apos;Georgia&apos;,serif;font-size:30px;fill:rgba(255,255,255,.2);animation:float 6s infinite ease-in-out}</style></defs><rect width="100%" height="100%" fill="url(#grad1)" rx="15" ry="15"/><text x="50" y="80" class="math-symbol" style="animation-delay:0s">∑</text><text x="150" y="160" class="math-symbol" style="animation-delay:1s">∫</text><text x="700" y="60" class="math-symbol" style="animation-delay:2s">π</text><text x="650" y="150" class="math-symbol" style="animation-delay:1.5s">∞</text><text x="350" y="50" class="math-symbol" style="animation-delay:.5s">√</text><text x="400" y="90" class="title anim-glow" text-anchor="middle">IMO 2026</text><text x="400" y="130" class="subtitle" text-anchor="middle">Regional Performance Analysis</text><text x="400" y="160" class="subtitle" text-anchor="middle" style="font-size:14px;fill:#b0c4de">Visualizing global mathematical excellence</text></svg>